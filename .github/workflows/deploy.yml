name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/docintel

            # Force VM to match latest main branch
            git fetch origin
            git reset --hard origin/main

            # Build frontend (output: frontend/dist/frontend/browser)
            cd /home/ubuntu/docintel/frontend
            npm ci
            npm run build

            # Publish build for nginx (www-data cannot read /home/ubuntu)
            sudo rm -rf /var/www/docintel/browser
            sudo cp -r /home/ubuntu/docintel/frontend/dist/frontend/browser /var/www/docintel/
            sudo chown -R www-data:www-data /var/www/docintel

            # Update backend dependencies and restart
            cd /home/ubuntu/docintel/backend
            source .venv/bin/activate
            pip install -r requirements.txt

            sudo systemctl restart docintel-backend
            sudo nginx -t
            sudo systemctl reload nginx

            # Health check with retries
            for i in {1..30}; do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo 'Backend health check passed'
                break
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/health
