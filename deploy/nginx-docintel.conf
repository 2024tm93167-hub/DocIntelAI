# DocIntel AI — nginx site config
# Serves the Angular build and proxies /api/* to the FastAPI backend.
# Install: sudo cp deploy/nginx-docintel.conf /etc/nginx/sites-available/docintel
#          sudo ln -s /etc/nginx/sites-available/docintel /etc/nginx/sites-enabled/docintel
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 65-2-35-115.sslip.io _;

    # /home/ubuntu is not readable by www-data, so the build output is copied
    # to /var/www/docintel/browser by deploy/setup-server.sh and deploy.yml
    root /var/www/docintel/browser;
    index index.html;

    # Backend API (FastAPI has no /api prefix; the prefix is stripped here)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI streaming endpoints can be slow
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
