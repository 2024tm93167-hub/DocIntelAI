<h2 mat-dialog-title>Save version</h2>
<mat-dialog-content>
  <p class="hint">This creates a permanent snapshot of the document as it is right now.</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Version label (optional)</mat-label>
    <input matInput [(ngModel)]="label" placeholder="e.g. Draft v1" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Save snapshot</button>
</mat-dialog-actions>
